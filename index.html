<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050608"><title>OTHER</title><link rel="stylesheet" href="./src/app.css"></head><body><main class="shell"><header><div><div class="eyebrow">OTHER / LIVE COMPOSITION SYSTEM</div><h1>OTHER</h1><p>Don't generate a song. Enter a performance.</p></div><div id="status" class="status">DORMANT</div></header><section class="stage"><div class="orb" id="orb"><div class="core"></div></div><div class="now"><span>NOW PLAYING</span><strong id="section">SILENCE</strong><small id="motif">waiting for a first thought</small></div></section><section class="transport"><button id="play" class="primary">ENTER</button><button id="stop" disabled>END</button><div><span class="label">TEMPO</span><strong id="tempo">102 BPM</strong></div><div><span class="label">TIME</span><strong id="bar">00:00</strong></div></section><section class="direct"><button id="keep"><b>✦ REMEMBER</b><span>this mattered</span></button><button id="more"><b>↑ PUSH</b><span>take it further</span></button><button id="less"><b>↓ BREATHE</b><span>make space</span></button><button id="change"><b>↝ TURN</b><span>surprise us</span></button></section><section class="meters"><div><span>ENERGY</span><progress id="energy" max="1"></progress></div><div><span>TENSION</span><progress id="tension" max="1"></progress></div></section><section class="journal"><div><span class="label">MEMORY</span><strong id="kept">0 moments</strong></div><p id="message">OTHER is not playing yet.</p></section></main><script type="module" src="./src/app.ts"></script></body></html>
